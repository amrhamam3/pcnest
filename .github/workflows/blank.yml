name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # الخطوة السحرية: تثبيت جاردل وتوليد الملف الناقص تلقائياً
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: gradle wrapper

    # تشغيل أمر البناء الآن بنجاح — بيولّد صيغتين: EXE وMSI
    - name: Build Distributables
      run: ./gradlew packageDistributionForCurrentOS

    # رفع ملفات الـ EXE وMSI الناتجة كـ Artifact عشان تقدر تنزّلهم من صفحة الـ run
    - name: Upload Installer Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Amr3D-Nesting-Pro-installers
        path: |
          build/compose/binaries/main/exe/*.exe
          build/compose/binaries/main/msi/*.msi
        if-no-files-found: error
